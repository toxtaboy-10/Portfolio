<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Page not found</title>
  <!-- Styles are inline so this page also works when GitHub Pages serves it from a nested URL. -->
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
      background:radial-gradient(60% 50% at 50% 0%,#2a1250 0%,#06040c 70%);color:#f6f4ff;
      font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
    .card{max-width:460px;padding:40px 32px;border-radius:28px;border:1px solid rgba(167,139,250,.25);
      background:rgba(255,255,255,.05);backdrop-filter:blur(14px);box-shadow:0 0 80px rgba(139,61,255,.25)}
    h1{margin:0;font-size:clamp(4rem,18vw,7rem);line-height:1;
      background:linear-gradient(135deg,#c4b5fd,#8b3dff);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#a79fbf;line-height:1.6}
    a{display:inline-block;margin-top:12px;padding:14px 28px;border-radius:999px;color:#fff;text-decoration:none;font-weight:600;
      background:linear-gradient(135deg,#9d4dff,#6d28d9);box-shadow:0 0 30px rgba(139,61,255,.45)}
    a:focus-visible{outline:2px solid #c4b5fd;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>This page could not be found.<br>Sahifa topilmadi. · Страница не найдена.</p>
    <!-- If the site lives at username.github.io/repo-name/, change href to "/repo-name/" -->
    <a href="/">Home · Bosh sahifa · Главная</a>
  </main>
</body>
</html>
